<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="HAMIZ">
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="324" y1="80" x2="876" y2="190">
      <stop offset="0" stop-color="#5E5CE6"/>
      <stop offset=".5" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#64D2FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="75%">
      <stop offset="0" stop-color="#0A84FF" stop-opacity=".28"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    text { font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
    .bg  { fill: #000; }
    .sub { fill: #86868b; }
    @media (prefers-color-scheme: light) {
      .bg  { fill: #fbfbfd; }
      .sub { fill: #6e6e73; }
    }
    .in { opacity: 0; animation: in 1.2s cubic-bezier(.2,.8,.2,1) forwards; }
    .d1 { animation-delay: .15s; }
    .d2 { animation-delay: .45s; }
    @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  </style>

  <rect class="bg" width="1200" height="320" rx="28"/>
  <rect width="1200" height="320" rx="28" fill="url(#glow)"/>

  <g class="in d1">
    <g transform="translate(0,-10)" fill="none" stroke="url(#g)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
      <!-- H -->
      <path d="M324 90 V190 M404 90 V190 M324 140 H404"/>
      <!-- A -->
      <path d="M452 190 L500 90 L548 190 M471 150 H529"/>
      <!-- M -->
      <path d="M596 190 V90 L648 150 L700 90 V190"/>
      <!-- I -->
      <path d="M748 90 V190"/>
      <!-- Z -->
      <path d="M796 90 H876 L796 190 H876"/>
    </g>
  </g>

  <text class="in d2 sub" x="600" y="248" text-anchor="middle" font-size="22" font-weight="500" letter-spacing="0.5">Computer Science · Systems · AI Engineering</text>
</svg>
